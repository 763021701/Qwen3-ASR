run_name: poc_autonly_stage2_all_1ep

# Stage 2 (2026-11-16): all current train data, all parameters trainable.
# Data is data/poc_train_unified_v2/all.jsonl plus real_target_domain_vc.
# model_path is rewritten by tools/run_autonly_two_stage_chain.sh to the
# stage-1 best-CER checkpoint before this run starts.
# Hyper-parameters copy the plus0821 champion recipe, except micro-batch
# 4 x grad_acc 8 (effective batch 32) while the GPU is exclusive.
# CER selection on POC53.

dataset:
  source_type: real_raw_denoised
  language: "None"
  validation_language: ""
  raw_jsonl: raw/POC_train/real_target_domain/metadata_raw.jsonl
  denoised_jsonl: raw/POC_train/real_target_domain/metadata_denoised.jsonl
  test_source: raw/POC_test/pathology.jsonl
  use_test_as_dev: 1
  output_dir: data/poc_autonly/stage2_all
  train_jsonl: data/poc_autonly/stage2_all/train.jsonl
  dev_jsonl: data/poc_autonly/stage2_all/dev.jsonl
  test_jsonl: data/poc_autonly/stage2_all/test.jsonl
  dev_fraction: 0.2
  split_seed: 42
  check_audio: 1

training:
  model_path: /root/autodl-tmp/workspace/project/Qwen3-ASR-FT/outputs/poc_autonly_stage1_realvc_1ep/checkpoint-200
  output_dir: outputs/poc_autonly_stage2_all_1ep
  batch_size: 4
  grad_acc: 8
  lr: 2e-5
  lr_scheduler_type: linear
  warmup_ratio: 0.02
  epochs: 1
  save_steps: 200
  save_total_limit: 2
  save_best_total_limit: 2
  save_best_metric: cer
  wer_eval_samples: 0
  wer_batch_size: 2
  wer_max_new_tokens: 512
  log_steps: 10
  sr: 16000
  num_workers: 8
  prefetch_factor: 2
  strip_target_brackets: 1
  augment: 1
  augment_prob: 1.0
  speed_prob: 0.5
  speed_factors: "0.8,0.85,0.9,0.95,1.0,1.05,1.1,1.15,1.2"
  noise_prob: 0.5
  noise_snr_min: 5.0
  noise_snr_max: 20.0
  noise_dir: raw/POC_train/noise/noise_target_domain
  specaug_prob: 0.5
  specaug_time_mask_param: 50
  specaug_freq_mask_param: 27
  specaug_num_time_masks: 2
  specaug_num_freq_masks: 2
  nospeech_augment: 1
  nospeech_prob: 0.3
  nospeech_pad_min_sec: 0.5
  nospeech_pad_max_sec: 3.0

evaluation:
  eval_script: evaluation/english_medical/eval_english_medical_asr_jsonl.py
  model: ""
  language: ""
  output_dir: outputs/poc_autonly_stage2_all_1ep/eval
  batch_size: 2
  max_new_tokens: 512

runtime:
  launcher: python
  nproc_per_node: 1
  resume: false
  dry_run: false
