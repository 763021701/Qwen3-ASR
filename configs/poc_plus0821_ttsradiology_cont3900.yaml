run_name: poc_plus0821_ttsradiology_cont3900

# Experiment B (2026-10-23): does adding tts_radiology synth improve radiology eval?
# continue-SFT from champion plus0821 checkpoint-3900 on the plus0821 mix
# PLUS 8,002 tts_radiology rows. 2026-10-23 note: 23,383/23,813 youtube_med_en wavs have
# been deleted from disk since the champion run, so the builder drops base rows whose
# audio is missing (mix = 44,894 replay + 8,002 synth = 52,896 rows, synth share 15.1%).
# Only init/LR/epochs differ from the champion recipe: lr 5e-6 + warmup 0.1
# (project-safe continue values), 1 epoch (~1,653 steps).
# Selection stays on the 53-clip POC dev CER; radiology sets are report-only
# (extra_eval_sets never feed selection). Baselines: ckpt-3900 POC53 7.65%,
# radiology holdout19 WER 67.73%, radiology95 WER 72.74%.
# Manifest prebuilt by tools/build_tts_radiology_manifest.py; run --stage train only.
dataset:
  source_type: real_raw_denoised
  language: "None"
  validation_language: ""
  raw_jsonl: raw/POC_train/real_target_domain/metadata_raw.jsonl
  denoised_jsonl: raw/POC_train/real_target_domain/metadata_denoised.jsonl
  test_source: raw/POC_test/pathology.jsonl
  use_test_as_dev: 1
  output_dir: data/poc_train_plus0821_ttsradiology
  train_jsonl: data/poc_train_plus0821_ttsradiology/train.jsonl
  dev_jsonl: data/poc_train_plus0821_ttsradiology/dev.jsonl
  test_jsonl: data/poc_train_plus0821_ttsradiology/test.jsonl
  dev_fraction: 0.2
  split_seed: 42
  check_audio: 1

training:
  model_path: /root/autodl-tmp/workspace/project/Qwen3-ASR-FT/outputs/poc_train_real_llm_syn_cantonese_num_measure_tts_pathology_full_testdev_cer_sft_nodual_curated_fullvoice_clean_v2synth_yt_plus0821_fromscratch600/checkpoint-3900
  output_dir: outputs/poc_plus0821_ttsradiology_cont3900
  batch_size: 2
  grad_acc: 16
  lr: 5e-6
  lr_scheduler_type: linear
  warmup_ratio: 0.1
  epochs: 1
  save_steps: 100
  save_total_limit: 3
  save_best_total_limit: 3
  save_best_metric: cer
  wer_eval_samples: 0
  wer_batch_size: 2
  wer_max_new_tokens: 512
  log_steps: 10
  sr: 16000
  num_workers: 8
  prefetch_factor: 2
  strip_target_brackets: 1
  augment: 1
  augment_prob: 1.0
  speed_prob: 0.5
  speed_factors: "0.8,0.85,0.9,0.95,1.0,1.05,1.1,1.15,1.2"
  noise_prob: 0.5
  noise_snr_min: 5.0
  noise_snr_max: 20.0
  noise_dir: raw/POC_train/noise/noise_target_domain
  specaug_prob: 0.5
  specaug_time_mask_param: 50
  specaug_freq_mask_param: 27
  specaug_num_time_masks: 2
  specaug_num_freq_masks: 2
  nospeech_augment: 1
  nospeech_prob: 0.3
  nospeech_pad_min_sec: 0.5
  nospeech_pad_max_sec: 3.0
  extra_eval_sets:
    radiology: raw/POC_test/radiology.csv
    radiology_holdout: data/poc_radiology_oracle_eval/holdout19.csv

evaluation:
  eval_script: evaluation/english_medical/eval_english_medical_asr_jsonl.py
  model: outputs/poc_plus0821_ttsradiology_cont3900/checkpoint-2384
  language: ""
  output_dir: outputs/poc_plus0821_ttsradiology_cont3900/eval
  batch_size: 2
  max_new_tokens: 512

runtime:
  launcher: python
  nproc_per_node: 1
  resume: false
  dry_run: false