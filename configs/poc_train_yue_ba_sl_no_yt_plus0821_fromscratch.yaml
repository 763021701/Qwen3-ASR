run_name: poc_train_yue_ba_sl_no_yt_plus0821_fromscratch

# Data-only change vs the ckpt-3900 run (plus0821): tts_pathology -> CosyVoice
# B_pathref/B_slref (CJK-digit code-switch synth), llm_text_syn -> A_pathref/A_slref,
# + switchlingua_cantonese_english (7,272), - youtube_med_en (23,813). Labels are
# the spoken text as-is (user decision 2026-10-16); noise_aug=1 on all new rows.
# All other settings identical to plus0821. Manifest prebuilt by
# tools/build_ba_sl_manifest.py; run --stage train only (re-running prepare would
# rebuild without the prebuilt manifest).
dataset:
  source_type: real_raw_denoised
  language: "None"
  validation_language: ""
  raw_jsonl: raw/POC_train/real_target_domain/metadata_raw.jsonl
  denoised_jsonl: raw/POC_train/real_target_domain/metadata_denoised.jsonl
  test_source: raw/POC_test/pathology.jsonl
  use_test_as_dev: 1
  output_dir: data/poc_train_yue_ba_sl_no_yt_plus0821
  train_jsonl: data/poc_train_yue_ba_sl_no_yt_plus0821/train.jsonl
  dev_jsonl: data/poc_train_yue_ba_sl_no_yt_plus0821/dev.jsonl
  test_jsonl: data/poc_train_yue_ba_sl_no_yt_plus0821/test.jsonl
  dev_fraction: 0.2
  split_seed: 42
  check_audio: 1

training:
  model_path: /root/.cache/huggingface/hub/models--Qwen--Qwen3-ASR-1.7B/snapshots/7278e1e70fe206f11671096ffdd38061171dd6e5
  output_dir: outputs/poc_train_yue_ba_sl_no_yt_plus0821_fromscratch
  batch_size: 2
  grad_acc: 16
  lr: 2e-5
  lr_scheduler_type: linear
  warmup_ratio: 0.02
  epochs: 3
  save_steps: 100
  save_total_limit: 3
  save_best_total_limit: 3
  save_best_metric: cer
  wer_eval_samples: 0
  wer_batch_size: 2
  wer_max_new_tokens: 512
  log_steps: 10
  sr: 16000
  num_workers: 8
  prefetch_factor: 2
  strip_target_brackets: 1
  augment: 1
  augment_prob: 1.0
  speed_prob: 0.5
  speed_factors: "0.8,0.85,0.9,0.95,1.0,1.05,1.1,1.15,1.2"
  noise_prob: 0.5
  noise_snr_min: 5.0
  noise_snr_max: 20.0
  noise_dir: raw/POC_train/noise/noise_target_domain
  specaug_prob: 0.5
  specaug_time_mask_param: 50
  specaug_freq_mask_param: 27
  specaug_num_time_masks: 2
  specaug_num_freq_masks: 2
  nospeech_augment: 1
  nospeech_prob: 0.3
  nospeech_pad_min_sec: 0.5
  nospeech_pad_max_sec: 3.0
  extra_eval_sets:
    radiology: raw/POC_test/radiology.csv

evaluation:
  eval_script: evaluation/english_medical/eval_english_medical_asr_jsonl.py
  model: outputs/poc_train_yue_ba_sl_no_yt_plus0821_fromscratch/checkpoint-600
  language: ""
  output_dir: outputs/poc_train_yue_ba_sl_no_yt_plus0821_fromscratch/eval
  batch_size: 2
  max_new_tokens: 512

runtime:
  launcher: python
  nproc_per_node: 1
  resume: false
  dry_run: false
