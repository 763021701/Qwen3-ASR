# 2000-hour multilingual robust LoRA run (ModelScope streaming).
#
# Step math: the prewarmed first shards average 4.20s/sample (hour-weighted
# harmonic mean) -> ~1.71M samples. Effective batch = 8 * 4 = 32, so 53,500
# steps is ~2,000h of audio. Pilot step time ~2.36s -> ~35h plus I/O.
#
# Resumed from checkpoint-4000 after repeated DataLoader resource-sharer
# crashes (workers dying silently). DataLoader workers now use the spawn
# context with num_workers=2 and pin_memory=1. runtime.resume=true makes a
# stopped run continue from the latest checkpoint automatically.
# batch=2/grad_acc=16 keeps the effective batch at 32 while reserving GPU
# memory for co-located tasks. The spool writes WAV to cut FLAC codec CPU.
run_name: poc_robust_multilingual_lora_2000h
runtime:
  dry_run: false
  launcher: python
  nproc_per_node: 1
  # After a stop, re-running --stage train resumes from the latest checkpoint-*.
  resume: true
training:
  data_config: configs/data_configs/robust_multilingual_2000h.yaml
  model_path: /root/.cache/huggingface/hub/models--Qwen--Qwen3-ASR-1.7B/snapshots/7278e1e70fe206f11671096ffdd38061171dd6e5
  output_dir: outputs/poc_robust_multilingual_lora_2000h
  batch_size: 2
  grad_acc: 16
  max_steps: 53500
  epochs: 1
  lr: 2e-5
  lr_scheduler_type: linear
  warmup_ratio: 0.02
  log_steps: 10
  # 289MB per LoRA checkpoint; keep the last ~6000 steps for checkpoint
  # selection after the run.
  save_steps: 500
  save_total_limit: 6
  save_best_total_limit: 0
  sr: 16000
  strip_target_brackets: 0
  num_workers: 2
  pin_memory: 1
  persistent_workers: 0
  prefetch_factor: 2
  use_lora: 1
  lora_scope: all
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_bias: none
  lr_encoder: 2e-5
  lr_aligner: 2e-5
  lr_llm: 2e-5
