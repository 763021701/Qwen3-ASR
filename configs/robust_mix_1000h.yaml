# 1000-hour robustness run on configs/data_configs/robust_mix_1000h.yaml.
#
# LoRA all, r=16, alpha=32, dropout 0.05, lr 2e-5. Step math:
#   1000h * 3600 / 4.20s / effective batch 32 ~= 26,786 -> max_steps 26800
#   500h checkpoint is step 13400. save_steps=13400 keeps that point and the
#   final step (save_total_limit=2).
#
# Acceptance is the full benchmark against base Qwen3-ASR-1.7B. This file
# does not launch training by itself.
run_name: robust_mix_1000h
runtime:
  dry_run: false
  launcher: python
  nproc_per_node: 1
  resume: true
training:
  data_config: configs/data_configs/robust_mix_1000h.yaml
  model_path: /root/.cache/huggingface/hub/models--Qwen--Qwen3-ASR-1.7B/snapshots/7278e1e70fe206f11671096ffdd38061171dd6e5
  output_dir: outputs/robust_mix_1000h
  batch_size: 8
  grad_acc: 4
  max_steps: 26800
  epochs: 1
  lr: 2e-5
  lr_scheduler_type: linear
  warmup_ratio: 0.02
  log_steps: 10
  save_steps: 13400
  save_total_limit: 2
  save_best_total_limit: 0
  sr: 16000
  strip_target_brackets: 0
  num_workers: 4
  pin_memory: 1
  persistent_workers: 0
  prefetch_factor: 2
  use_lora: 1
  lora_scope: all
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_bias: none
  lr_encoder: 2e-5
  lr_aligner: 2e-5
  lr_llm: 2e-5
