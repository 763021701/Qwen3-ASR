# Balanced two-group SFT: SwitchLingua vs l2arctic + YouTube sources.
# Labels: language None<asr_text>...
# No standalone test split; eval stage skipped (no evaluation block).

run_name: balanced_none_speed_sft

dataset:
  source_type: balanced_multilingual
  language: None
  raw_dir: raw
  l2arctic_csv: raw/l2arctic_english_chinese.csv
  switchlingua_jsonl: raw/switchlingua_cantonese_english_wav16k.jsonl
  youtube_mix_jsonl: raw/youtube_english_cantonese.jsonl
  youtube_en_jsonl: raw/youtube_english.jsonl
  output_dir: data/balanced_multilingual
  check_audio: 1
  split_seed: 42
  train_ratio: 0.95
  dev_ratio: 0.05

training:
  model_path: Qwen/Qwen3-ASR-1.7B
  output_dir: outputs/balanced_none_speed_sft
  batch_size: 2
  grad_acc: 8
  lr: 2e-5
  epochs: 3
  save_steps: 400
  save_total_limit: 2
  log_steps: 50
  sr: 16000
  num_workers: 8
  prefetch_factor: 4
  augment: 1
  augment_prob: 1.0
  speed_prob: 0.9
  speed_factors: "1.0,1.1,1.2,1.3,1.4,1.5,1.6,1.7,1.8,1.9,2.0"
  noise_prob: 0.3
  noise_snr_min: 15
  noise_snr_max: 30
  specaug_prob: 0

runtime:
  launcher: python
  nproc_per_node: 1
  dry_run: false
