run_name: poc_small_realraw_noaug_1ep

# Small-data probe 1: real_target_domain RAW channels only (1,451 rows / 3.16 h).
# Noise augmentation disabled (noise_prob=0 and per-row noise_aug=0); other
# augmentations (speed/SpecAug/no-speech) stay on the champion recipe so the
# comparison with probe 2 isolates noise handling.

dataset:
  source_type: real_raw_denoised
  language: "None"
  validation_language: ""
  raw_jsonl: raw/POC_train/real_target_domain/metadata_raw.jsonl
  denoised_jsonl: raw/POC_train/real_target_domain/metadata_denoised.jsonl
  test_source: raw/POC_test/pathology.jsonl
  use_test_as_dev: 1
  output_dir: data/poc_small_experiments/realraw_noaug
  train_jsonl: data/poc_small_experiments/realraw_noaug/train.jsonl
  dev_jsonl: data/poc_small_experiments/realraw_noaug/dev.jsonl
  test_jsonl: data/poc_small_experiments/realraw_noaug/test.jsonl
  dev_fraction: 0.2
  split_seed: 42
  check_audio: 1

training:
  model_path: /root/.cache/huggingface/hub/models--Qwen--Qwen3-ASR-1.7B/snapshots/7278e1e70fe206f11671096ffdd38061171dd6e5
  output_dir: outputs/poc_small_realraw_noaug_1ep
  batch_size: 2
  grad_acc: 16
  lr: 2e-5
  lr_scheduler_type: linear
  warmup_ratio: 0.02
  epochs: 1
  save_steps: 10
  save_total_limit: 2
  save_best_total_limit: 2
  save_best_metric: cer
  wer_eval_samples: 0
  wer_batch_size: 2
  wer_max_new_tokens: 512
  log_steps: 5
  sr: 16000
  num_workers: 8
  prefetch_factor: 2
  pin_memory: 0
  strip_target_brackets: 1
  augment: 1
  augment_prob: 1.0
  speed_prob: 0.5
  speed_factors: "0.8,0.85,0.9,0.95,1.0,1.05,1.1,1.15,1.2"
  noise_prob: 0.0
  noise_snr_min: 5.0
  noise_snr_max: 20.0
  noise_dir: raw/POC_train/noise/noise_target_domain
  specaug_prob: 0.5
  specaug_time_mask_param: 50
  specaug_freq_mask_param: 27
  specaug_num_time_masks: 2
  specaug_num_freq_masks: 2
  nospeech_augment: 1
  nospeech_prob: 0.3
  nospeech_pad_min_sec: 0.5
  nospeech_pad_max_sec: 3.0

evaluation:
  eval_script: evaluation/english_medical/eval_english_medical_asr_jsonl.py
  model: ""
  language: ""
  output_dir: outputs/poc_small_realraw_noaug_1ep/eval
  batch_size: 2
  max_new_tokens: 512

runtime:
  launcher: python
  nproc_per_node: 1
  resume: false
  dry_run: false
