# Data config for configs/examples/uyghur_common_voice_pipeline.yaml.
data:
  sources:
    - name: uyghur_common_voice
      backend: jsonl
      path: ../../data/uyghur/common_voice_pipeline/train.jsonl
      text_template: raw
      weight: 1.0
  mixture:
    seed: 42
  augmentation:
    speed:
      enabled: true
      prob: 0.5
      factors: [0.9, 0.95, 1.0, 1.05, 1.1]
    specaug:
      enabled: true
      prob: 0.5
