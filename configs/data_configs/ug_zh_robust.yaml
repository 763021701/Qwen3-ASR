# Data config for scripts/train_ug_zh_robust.sh.
data:
  sources:
    - name: ug_zh_combined
      backend: jsonl
      path: ../../data/combined_ug_zh/train.jsonl
      text_template: raw
      weight: 1.0
  mixture:
    seed: 42
  augmentation:
    speed:
      enabled: true
      prob: 0.5
      factor_min: 0.8
      factor_max: 1.6
    specaug:
      enabled: true
      prob: 0.5
