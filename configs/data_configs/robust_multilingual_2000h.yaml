# 2000-hour multilingual robust training mix (ModelScope streaming).
#
# Prewarm the first shard of every source before launching training:
#   python tools/prewarm_stream_cache.py \
#       --data_config configs/data_configs/robust_multilingual_2000h.yaml
#
# Target domain = the six public corpora below after mega-asr-sim corruption.
# Weights are HOUR shares; mixture.weight_mode=hours keeps the long-form
# Cantonese corpus from dominating by sample count.
#
# Target hours per source (sum = 2000h). Versus the pilot, English and Chuan
# each gain 2.5pp to counter their clean-set regressions, funded by Wenet.
#   gigaspeech            550h  (27.5%)
#   wenetspeech           500h  (25.0%)
#   magicdata_read         83h  ( 4.15%)
#   magicdata_conv         15h  ( 0.75%)
#   magicdata_heavy         2h  ( 0.10%)
#   kespeech              200h  (10.0%)
#   chuan                 250h  (12.5%)
#   yue                   400h  (20.0%)
data:
  sources:
    - name: gigaspeech
      backend: webdataset
      provider: modelscope
      repo_id: huangpppu/Gigaspeech-train-clean
      path_in_repo: webdataset
      split: train
      fields: {audio: flac, meta: json}
      text_key: text
      language: English
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 12518
      # Clean eval shards must never enter training.
      shard_exclude:
        - webdataset/gigaspeech-train-00000-00007.tar
        - webdataset/gigaspeech-train-00008-00015.tar
      weight: 0.275

    - name: wenetspeech
      backend: webdataset
      provider: modelscope
      repo_id: huangpppu/WenetSpeech
      path_in_repo: TRAIN
      split: train
      fields: {audio: flac, meta: json}
      text_key: text
      language: Chinese
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 9290
      shard_exclude:
        - TRAIN/wenetspeech-L-00000000-00000001.tar
      weight: 0.25

    # MAGICDATA ships three independently indexed subsets.
    - name: magicdata_read
      backend: webdataset
      provider: modelscope
      repo_id: huangpppu/MAGICDATA-Mandarin
      path_in_repo: MAGICDATA-Mandarin-Read
      split: train
      fields: {audio: flac, text: txt, meta: json}
      language: Chinese
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 711.9
      weight: 0.0415

    - name: magicdata_conv
      backend: webdataset
      provider: modelscope
      repo_id: huangpppu/MAGICDATA-Mandarin
      path_in_repo: MAGICDATA-Mandarin-Conversational
      split: train
      fields: {audio: flac, text: txt, meta: json}
      language: Chinese
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 128.7
      weight: 0.0075

    - name: magicdata_heavy
      backend: webdataset
      provider: modelscope
      repo_id: huangpppu/MAGICDATA-Mandarin
      path_in_repo: MAGICDATA-Mandarin-Heavy-Accent
      split: train
      fields: {audio: flac, text: txt, meta: json}
      language: Chinese
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 18.4
      weight: 0.001

    - name: kespeech
      backend: webdataset
      provider: modelscope
      repo_id: huangpppu/KeSpeech
      path_in_repo: /
      split: train
      shard_pattern: "kespeech-train_*.tar"
      fields: {audio: flac, text: txt, meta: json}
      language: Chinese
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 1397
      weight: 0.10

    - name: chuan
      backend: webdataset
      provider: modelscope
      repo_id: huangpppu/WenetSpeech-Chuan
      path_in_repo: labeled
      split: train
      fields: {audio: flac, meta: json}
      text_key: text
      language: Chinese
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 1998
      shard_exclude:
        - labeled/audios_028-000.tar
        - labeled/audios_028-001.tar
      weight: 0.125

    - name: yue
      backend: webdataset
      provider: modelscope
      repo_id: huangpppu/WenetSpeech-Yue
      path_in_repo: labeled
      split: train
      fields: {audio: flac, meta: json}
      text_key: text
      language: Cantonese
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 18580
      shard_exclude:
        - labeled/part_000-000.tar
        - labeled/part_000-001.tar
      weight: 0.20

  mixture:
    seed: 42
    total_hours: 2000
    weight_mode: hours
    sample_shuffle_buffer: 1000
    repeat_small_sources: true

  # Disk budget: ~137GB free. Caps are per source cache; sources sharing one
  # repo root each enforce the root budget. MAGICDATA's three subsets need
  # current + prefetched shards resident at once (4.5+4.5+1.3GB each round),
  # so the shared root gets 21GB. KeSpeech shards are 4.3GB each (10GB).
  # Everything else only needs current + next (~2GB) and gets 8GB.
  cache:
    dir: ../../outputs/ms_cache_2000h
    max_gb: 8
    per_source_max_gb:
      kespeech: 10
      magicdata_read: 21
      magicdata_conv: 21
      magicdata_heavy: 21
    min_free_gb: 25
    prefetch_shards: 1
    max_concurrent_downloads: 1
    retries: 3
    timeout_sec: 600
    index_ttl_sec: 86400

  augmentation:
    speed:
      enabled: true
      prob: 0.5
      factors: [0.9, 0.95, 1.0, 1.05, 1.1]
    specaug:
      enabled: true
      prob: 0.5
      time_mask_param: 50
      freq_mask_param: 27
      num_time_masks: 2
      num_freq_masks: 2
    simulation:
      enabled: true
      spool_dir: ../../outputs/aug_spool_2000h
      scenarios:
        - noise
        - far_field
        - obstructed
        - echo_reverb
        - recording
        - distortion
        - dropout
        - far_field+noise
        - echo_reverb+noise
        - obstructed+noise
      # Pilot used 0.15 / 0.85. More clean replay and an eval-aligned
      # severity ceiling target the clean regressions seen on English.
      clean_prob: 0.25
      clean_sources: []
      severity_min: 0.2
      severity_max: 0.80
      noise_dir: ../../data/augmentation/noise
      reverb_mode: mixed
      rir_dir: ../../data/augmentation/rir
      rir_cache_files: 128
      rir_real_prob: 0.7
      rir_mix_prob: 0.8
      # Pilot's 4 simulators ran at ~14 samples/s with training consuming
      # ~13.6 samples/s. 8 simulators leave ~2x headroom for streaming I/O.
      num_simulators: 8
      clean_queue_size: 128
      ready_queue_size: 512
      # WAV avoids FLAC encode/decode CPU in the simulator and DataLoader
      # workers; the spool is a small transient buffer.
      audio_format: wav
      # ~40h of WAV audio; steady-state usage is only a few hundred MB.
      max_spool_gb: 5
      # Allow for large-shard downloads on a cold streaming cache.
      stall_timeout_sec: 1800
      stats_log_interval_sec: 60
