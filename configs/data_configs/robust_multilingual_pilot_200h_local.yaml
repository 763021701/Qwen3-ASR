# 200-hour multilingual robust pilot using 18 staged local shards.
#
# Staged from ModelScope by tools/stage_pilot_shards.py. The shard set provides
# enough hours for each 200h source target while keeping eval shards out.
data:
  sources:
    - name: gigaspeech
      backend: webdataset
      provider: local
      path: ../../data/pilot_shards/gigaspeech
      split: train
      fields: {audio: flac, meta: json}
      text_key: text
      language: English
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 58.3
      weight: 0.25

    - name: wenetspeech
      backend: webdataset
      provider: local
      path: ../../data/pilot_shards/wenetspeech
      split: train
      fields: {audio: flac, meta: json}
      text_key: text
      language: Chinese
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 68.9
      weight: 0.30

    - name: magicdata_read
      backend: webdataset
      provider: local
      path: ../../data/pilot_shards/magicdata_read
      split: train
      fields: {audio: flac, text: txt, meta: json}
      language: Chinese
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 79.0
      weight: 0.0415

    - name: magicdata_conv
      backend: webdataset
      provider: local
      path: ../../data/pilot_shards/magicdata_conv
      split: train
      fields: {audio: flac, text: txt, meta: json}
      language: Chinese
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 74.0
      weight: 0.0075

    - name: magicdata_heavy
      backend: webdataset
      provider: local
      path: ../../data/pilot_shards/magicdata_heavy
      split: train
      fields: {audio: flac, text: txt, meta: json}
      language: Chinese
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 18.4
      weight: 0.001

    - name: kespeech
      backend: webdataset
      provider: local
      path: ../../data/pilot_shards/kespeech
      split: train
      fields: {audio: flac, text: txt, meta: json}
      language: Chinese
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 67.0
      weight: 0.10

    - name: chuan
      backend: webdataset
      provider: local
      path: ../../data/pilot_shards/chuan
      split: train
      fields: {audio: flac, meta: json}
      text_key: text
      language: Chinese
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 29.0
      weight: 0.10

    - name: yue
      backend: webdataset
      provider: local
      path: ../../data/pilot_shards/yue
      split: train
      fields: {audio: flac, meta: json}
      text_key: text
      language: Cantonese
      text_template: "language {language}<asr_text>{text}"
      estimated_hours: 57.3
      weight: 0.20

  mixture:
    seed: 42
    weight_mode: hours
    sample_shuffle_buffer: 500
    repeat_small_sources: true

  augmentation:
    speed:
      enabled: true
      prob: 0.5
      factors: [0.9, 0.95, 1.0, 1.05, 1.1]
    specaug:
      enabled: true
      prob: 0.5
      time_mask_param: 50
      freq_mask_param: 27
      num_time_masks: 2
      num_freq_masks: 2
    simulation:
      enabled: true
      spool_dir: ../../outputs/aug_spool_pilot_local
      scenarios:
        - noise
        - far_field
        - obstructed
        - echo_reverb
        - recording
        - distortion
        - dropout
        - far_field+noise
        - echo_reverb+noise
        - obstructed+noise
      clean_prob: 0.15
      clean_sources: []
      severity_min: 0.2
      severity_max: 0.85
      noise_dir: ../../data/augmentation/noise
      reverb_mode: mixed
      rir_dir: ../../data/augmentation/rir
      rir_cache_files: 128
      rir_real_prob: 0.7
      rir_mix_prob: 0.8
      num_simulators: 4
      audio_format: flac
      max_spool_gb: 20
      stall_timeout_sec: 600
      stats_log_interval_sec: 60
