# Robust pseudo-online simulation recipe for the plus0821 SFT / LoRA baseline.
#
# This is the A/B counterpart of plus0821_sft.yaml: same clean source, but every
# training sample goes through mega-asr-sim with real noise + mixed real RIRs.
data:
  sources:
    - name: plus0821
      backend: jsonl
      path: ../../data/poc_train_fullvoice_clean_v2synth_yt_plus0821/train.jsonl
      text_template: raw
      weight: 1.0
    # Add general-domain clean replay here, then list its name under
    # simulation.clean_sources so it bypasses acoustic simulation:
    # - name: general_clean
    #   backend: jsonl
    #   path: ../../data/general_clean/train.jsonl
    #   text_template: raw
    #   weight: 0.3
  mixture:
    seed: 42
  augmentation:
    speed:
      enabled: true
      prob: 0.5
      factors: [0.8, 0.85, 0.9, 0.95, 1.0, 1.05, 1.1, 1.15, 1.2]
    specaug:
      enabled: true
      prob: 0.5
      time_mask_param: 50
      freq_mask_param: 27
      num_time_masks: 2
      num_freq_masks: 2
    simulation:
      enabled: true
      spool_dir: ../../outputs/aug_spool_robust
      scenarios:
        - noise
        - far_field
        - obstructed
        - echo_reverb
        - recording
        - distortion
        - dropout
        - far_field+noise
        - echo_reverb+noise
        - obstructed+noise
      # Keep a small clean fraction in addition to source-level replay.
      clean_prob: 0.1
      clean_sources: []
      severity_min: 0.2
      severity_max: 0.85
      noise_dir: ../../data/augmentation/noise
      reverb_mode: mixed
      rir_dir: ../../data/augmentation/rir
      rir_cache_files: 128
      # 0.7 mixes measured and simulated RIRs; 1.0 uses measured RIRs only.
      rir_real_prob: 0.7
      rir_mix_prob: 0.8
      num_simulators: 4
      audio_format: flac
      max_spool_gb: 20
      stall_timeout_sec: 600
      stats_log_interval_sec: 60
