# Local JSONL data config for the plus0821 SFT / LoRA recipes.
data:
  sources:
    - name: plus0821
      backend: jsonl
      path: ../../data/poc_train_fullvoice_clean_v2synth_yt_plus0821/train.jsonl
      text_template: raw
      weight: 1.0
  mixture:
    seed: 42
  augmentation:
    speed:
      enabled: true
      prob: 0.5
      factors: [0.8, 0.85, 0.9, 0.95, 1.0, 1.05, 1.1, 1.15, 1.2]
    specaug:
      enabled: true
      prob: 0.5
      time_mask_param: 50
      freq_mask_param: 27
      num_time_masks: 2
      num_freq_masks: 2
    simulation:
      enabled: false
      spool_dir: ../../outputs/aug_spool
      noise_dir: ../../data/augmentation/noise
      reverb_mode: mixed
      rir_dir: ../../data/augmentation/rir
      rir_cache_files: 128
      # 1.0 = measured RIRs only; lower to mix in simulated_rirs.
      rir_real_prob: 1.0
      # Probability of real RIR vs synthetic RIR in reverb_mode=mixed.
      rir_mix_prob: 0.8
