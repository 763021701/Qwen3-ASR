run_name: poc_radiology_mix_m1_yt_1ep

# M1 (real target-domain x1, 7.0% rows) + the full real YouTube radiology set
# (raw/POC_train/youtube_med_en/radiology.jsonl: 36,428 rows / 164.8 h).
# 75,151 rows total (YouTube 48.5% of rows, 67.7% of hours), 1 epoch,
# bs2 x ga16 -> 2,348 updates; from BASE, otherwise identical to M1/E4 recipe.
# No overlap with radiology95 or holdout19.

dataset:
  source_type: radiology_sim
  language: "None"
  validation_language: ""
  output_dir: data/poc_train_radiology_mix_m1_yt
  train_jsonl: data/poc_train_radiology_mix_m1_yt/train.jsonl
  dev_jsonl: data/poc_radiology_oracle/holdout.jsonl
  test_jsonl: data/poc_radiology_oracle/holdout.jsonl
  check_audio: 1

training:
  model_path: /root/.cache/huggingface/hub/models--Qwen--Qwen3-ASR-1.7B/snapshots/7278e1e70fe206f11671096ffdd38061171dd6e5
  output_dir: outputs/poc_radiology_mix_m1_yt_1ep
  batch_size: 2
  grad_acc: 16
  lr: 2e-5
  lr_scheduler_type: linear
  warmup_ratio: 0.02
  epochs: 1
  save_steps: 300
  save_total_limit: 8
  save_best_total_limit: 0
  save_best_metric: eval_loss
  wer_eval_samples: 0
  wer_batch_size: 2
  wer_max_new_tokens: 512
  log_steps: 10
  sr: 16000
  num_workers: 8
  prefetch_factor: 2
  strip_target_brackets: 1
  augment: 1
  augment_prob: 1.0
  speed_prob: 0.5
  speed_factors: "0.8,0.85,0.9,0.95,1.0,1.05,1.1,1.15,1.2"
  noise_prob: 0.0
  specaug_prob: 0.5
  specaug_time_mask_param: 50
  specaug_freq_mask_param: 27
  specaug_num_time_masks: 2
  specaug_num_freq_masks: 2
  nospeech_augment: 1
  nospeech_prob: 0.3
  nospeech_pad_min_sec: 0.5
  nospeech_pad_max_sec: 3.0

evaluation:
  eval_script: evaluation/english_medical/eval_english_medical_asr_jsonl.py
  model: outputs/poc_radiology_mix_m1_yt_1ep/checkpoint-2349
  language: ""
  output_dir: outputs/poc_radiology_mix_m1_yt_1ep/eval_holdout
  batch_size: 4
  max_new_tokens: 512

runtime:
  launcher: python
  nproc_per_node: 1
  resume: false
  dry_run: false
