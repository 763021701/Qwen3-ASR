run_name: poc_unified7_directmix_2ep

# Scheme 1 (2026-11-10): direct 1:1-by-hours mix of all seven raw/POC_train sources.
# Synth 143.12 h (tts_pathology 31,307 + tts_radiology 28,035 + llm_text_syn 3,718
# + cantonese_measure 4,098 + cantonese_specimen_number 4,176) and real 143.12 h
# (real_target_domain 2,902 rows + YouTube sample 136.69 h / 29,768 rows), total
# 286.03 h / 104,004 rows, 2 epochs (6,500 updates at bs2 x ga16).
# YouTube sampling is seeded and proportional across pathology/radiology/hk_en_yue
# (see tools/build_unified_7src_manifests.py + data/poc_train_unified7/manifest_stats.json).
# All other hyper-parameters copy the plus0821 SFT-3900 champion recipe; from base,
# CER selection on the 53-clip POC dev (use_test_as_dev=1), radiology sets report-only.

dataset:
  source_type: real_raw_denoised
  language: "None"
  validation_language: ""
  raw_jsonl: raw/POC_train/real_target_domain/metadata_raw.jsonl
  denoised_jsonl: raw/POC_train/real_target_domain/metadata_denoised.jsonl
  test_source: raw/POC_test/pathology.jsonl
  use_test_as_dev: 1
  output_dir: data/poc_train_unified7/direct_mix
  train_jsonl: data/poc_train_unified7/direct_mix/train.jsonl
  dev_jsonl: data/poc_train_unified7/direct_mix/dev.jsonl
  test_jsonl: data/poc_train_unified7/direct_mix/test.jsonl
  dev_fraction: 0.2
  split_seed: 42
  check_audio: 1

training:
  model_path: /root/.cache/huggingface/hub/models--Qwen--Qwen3-ASR-1.7B/snapshots/7278e1e70fe206f11671096ffdd38061171dd6e5
  output_dir: outputs/poc_unified7_directmix_2ep
  batch_size: 2
  grad_acc: 16
  lr: 2e-5
  lr_scheduler_type: linear
  warmup_ratio: 0.02
  epochs: 2
  save_steps: 100
  save_total_limit: 3
  save_best_total_limit: 3
  save_best_metric: cer
  wer_eval_samples: 0
  wer_batch_size: 2
  wer_max_new_tokens: 512
  log_steps: 10
  sr: 16000
  num_workers: 8
  prefetch_factor: 2
  strip_target_brackets: 1
  augment: 1
  augment_prob: 1.0
  speed_prob: 0.5
  speed_factors: "0.8,0.85,0.9,0.95,1.0,1.05,1.1,1.15,1.2"
  noise_prob: 0.5
  noise_snr_min: 5.0
  noise_snr_max: 20.0
  noise_dir: raw/POC_train/noise/noise_target_domain
  specaug_prob: 0.5
  specaug_time_mask_param: 50
  specaug_freq_mask_param: 27
  specaug_num_time_masks: 2
  specaug_num_freq_masks: 2
  nospeech_augment: 1
  nospeech_prob: 0.3
  nospeech_pad_min_sec: 0.5
  nospeech_pad_max_sec: 3.0
  extra_eval_sets:
    radiology: raw/POC_test/radiology.csv
    radiology_holdout: data/poc_radiology_oracle_eval/holdout19.csv

evaluation:
  eval_script: evaluation/english_medical/eval_english_medical_asr_jsonl.py
  model: ""
  language: ""
  output_dir: outputs/poc_unified7_directmix_2ep/eval
  batch_size: 2
  max_new_tokens: 512

runtime:
  launcher: python
  nproc_per_node: 1
  resume: false
  dry_run: false
