run_name: poc_tts_radiology_simA_fromscratch

# E1 (2026-10-27): tts_radiology + Mega-ASR-style environment simulation.
# Data = all three CosyVoice voices (ep1/RAD_slref/RADP_pathref) degraded once by
# mega-asr-sim with 7 environment scenarios (round-robin, severity m~U(0,1)):
# noise, far_field, echo_reverb, obstructed, and their +noise variants.
# 12,003 rows / 24.26h; noise source = >=1s target-domain noise (radiology 54,
# pathology 446+233, curated 162). Training from BASE, full-param, bs2 x ga16,
# lr 2e-5, warmup 0.02, 3 epochs (376 steps/epoch = 1,128 updates).
# Online: speed+SpecAug only (audio already degraded -> no extra noise), nospeech on.
# No checkpoint selection; evaluate every epoch on radiology95/holdout19/POC53.
# Goal: radiology95 WER < 40% (baseline raw-synth ep1: 69.70%, base model: 67.72%).
dataset:
  source_type: radiology_sim
  language: "None"
  validation_language: ""
  output_dir: data/poc_train_tts_radiology_simA
  train_jsonl: data/poc_train_tts_radiology_simA/train.jsonl
  dev_jsonl: data/poc_radiology_oracle/holdout.jsonl
  test_jsonl: data/poc_radiology_oracle/holdout.jsonl
  check_audio: 1

training:
  model_path: /root/.cache/huggingface/hub/models--Qwen--Qwen3-ASR-1.7B/snapshots/7278e1e70fe206f11671096ffdd38061171dd6e5
  output_dir: outputs/poc_tts_radiology_simA_fromscratch
  batch_size: 2
  grad_acc: 16
  lr: 2e-5
  lr_scheduler_type: linear
  warmup_ratio: 0.02
  epochs: 3
  save_steps: 376
  save_total_limit: 4
  save_best_total_limit: 0
  save_best_metric: eval_loss
  wer_eval_samples: 0
  wer_batch_size: 2
  wer_max_new_tokens: 512
  log_steps: 10
  sr: 16000
  num_workers: 8
  prefetch_factor: 2
  strip_target_brackets: 1
  augment: 1
  augment_prob: 1.0
  speed_prob: 0.5
  speed_factors: "0.8,0.85,0.9,0.95,1.0,1.05,1.1,1.15,1.2"
  noise_prob: 0.0
  specaug_prob: 0.5
  specaug_time_mask_param: 50
  specaug_freq_mask_param: 27
  specaug_num_time_masks: 2
  specaug_num_freq_masks: 2
  nospeech_augment: 1
  nospeech_prob: 0.3
  nospeech_pad_min_sec: 0.5
  nospeech_pad_max_sec: 3.0

evaluation:
  eval_script: evaluation/english_medical/eval_english_medical_asr_jsonl.py
  model: outputs/poc_tts_radiology_simA_fromscratch/checkpoint-1128
  language: ""
  output_dir: outputs/poc_tts_radiology_simA_fromscratch/eval_holdout
  batch_size: 4
  max_new_tokens: 512

runtime:
  launcher: python
  nproc_per_node: 1
  resume: false
  dry_run: false