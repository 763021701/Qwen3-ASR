# 3000 h mix (M4, offline) on the shared GPU, merged over base.yaml:
#   python -m aut_ctc.train --config aut_ctc/configs/base.yaml aut_ctc/configs/mix3000h.yaml --exp_dir exp/mix3000h
# Mandarin 1100 h (WenetSpeech 800 + KeSpeech Mandarin/Accent 300), English 800 h (GigaSpeech), Cantonese 500 h
# (WenetSpeech-Yue), dialects ~540 h (KeSpeech subdialects ~150 + WenetSpeech-Chuan 390). Same dev sets as mix200h.
# Manifests: /root/autodl-tmp/huangpu/aut_ctc_data/build_mix3000h.py
data:
  train_manifests:
    - /root/autodl-tmp/huangpu/aut_ctc_data/manifests/mix3000h/train_gigaspeech.jsonl
    - /root/autodl-tmp/huangpu/aut_ctc_data/manifests/mix3000h/train_wenetspeech.jsonl
    - /root/autodl-tmp/huangpu/aut_ctc_data/manifests/mix3000h/train_kespeech_mandarin.jsonl
    - /root/autodl-tmp/huangpu/aut_ctc_data/manifests/mix3000h/train_kespeech_dialect.jsonl
    - /root/autodl-tmp/huangpu/aut_ctc_data/manifests/mix3000h/train_yue.jsonl
    - /root/autodl-tmp/huangpu/aut_ctc_data/manifests/mix3000h/train_chuan.jsonl
  sampling_weights: [800, 800, 300, 150, 500, 390]   # hours: each pass covers every manifest once
  dev_manifests:
    - /root/autodl-tmp/huangpu/aut_ctc_data/manifests/mix200h/dev_gigaspeech.jsonl
    - /root/autodl-tmp/huangpu/aut_ctc_data/manifests/mix200h/dev_wenetspeech.jsonl
    - /root/autodl-tmp/huangpu/aut_ctc_data/manifests/mix200h/dev_kespeech_mandarin.jsonl
    - /root/autodl-tmp/huangpu/aut_ctc_data/manifests/mix200h/dev_kespeech_dialect.jsonl
    - /root/autodl-tmp/huangpu/aut_ctc_data/manifests/mix200h/dev_chuan.jsonl
    - /root/autodl-tmp/huangpu/aut_ctc_data/manifests/mix200h/dev_yue.jsonl
  max_batch_seconds: 400
  num_workers: 8
optim:
  grad_accum: 3                  # 1200 s of audio per optimizer step
  gpu_memory_limit_gb: 8
  warmup_steps: 5000
  epochs: 10                     # ~9k steps per epoch, ~14 h at ~0.55 s/step
eval:
  every_steps: 2000
