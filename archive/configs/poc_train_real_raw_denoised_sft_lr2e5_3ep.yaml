run_name: poc_train_real_raw_denoised_sft_lr2e5_3ep

dataset:
  source_type: real_raw_denoised
  language: "None"
  validation_language: "None"
  raw_jsonl: raw/POC_train/real_target_domain/metadata_raw.jsonl
  denoised_jsonl: raw/POC_train/real_target_domain/metadata_denoised.jsonl
  test_source: raw/POC_test/metadata.jsonl
  output_dir: data/poc_train_real_raw_denoised
  train_jsonl: data/poc_train_real_raw_denoised/train.jsonl
