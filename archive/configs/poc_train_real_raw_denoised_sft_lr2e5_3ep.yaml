  output_dir: outputs/poc_train_real_raw_denoised_sft_lr2e5_3ep
  batch_size: 2
  grad_acc: 16
  lr: 2e-5
  lr_scheduler_type: linear
  warmup_ratio: 0.02
  epochs: 3
  save_steps: 25
  save_total_limit: 5
  save_best_total_limit: 5
  save_best_metric: eval_loss
  early_stopping_metric: eval_loss
  early_stopping_patience: 5
  early_stopping_threshold: 0.0
  log_steps: 10
  sr: 16000
  num_workers: 8
  prefetch_factor: 2
  strip_target_brackets: 1
