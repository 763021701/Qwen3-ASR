run_name: poc_sft3900_real_hotword_prompt_ft

# NEGATIVE (2026-09-21): freeze-tower continue-SFT from 3900 on real-domain
# empty+gold/distractor prompts did not restore hotword following.
# Best in-train CER 5.89% (step-100) vs 3900 5.63%; 53-clip WER 8.00% vs 7.65%.
# 10-clip gold hit unchanged (62% / hard 52%). Weights deleted; logs+eval kept.
#
# Continue-SFT from checkpoint-3900 on real-domain rows only.
# All empty-context copies are kept; ~20% extra rows get gold / gold+distractor /
# distractor prompts. Audio tower frozen so only the LLM relearns context following.
# Dev/test remain the 53-clip POC set (not in train). Run --stage train only.
dataset:
  source_type: prepared_jsonl
  language: "None"
  validation_language: ""
  output_dir: data/poc_sft3900_real_hotword_prompt
  train_jsonl: data/poc_sft3900_real_hotword_prompt/train.jsonl
  dev_jsonl: data/poc_train_fullvoice_clean_v2synth_yt_plus0821/dev.jsonl
  test_jsonl: data/poc_train_fullvoice_clean_v2synth_yt_plus0821/test.jsonl
  check_audio: 1

training:
  model_path: outputs/poc_train_real_llm_syn_cantonese_num_measure_tts_pathology_full_testdev_cer_sft_nodual_curated_fullvoice_clean_v2synth_yt_plus0821_fromscratch600/checkpoint-3900
  output_dir: outputs/poc_sft3900_real_hotword_prompt_ft
  batch_size: 2
  grad_acc: 16
  lr: 5.0e-6
  lr_scheduler_type: linear
  warmup_ratio: 0.05
  epochs: 2
  freeze_modules: "encoder,aligner"
  save_steps: 25
  save_total_limit: 3
  save_best_total_limit: 3
  save_best_metric: cer
  wer_eval_samples: 0
  wer_batch_size: 2
  wer_max_new_tokens: 512
  log_steps: 10
  sr: 16000
  num_workers: 8
  prefetch_factor: 2
  strip_target_brackets: 1
  augment: 0
  extra_eval_sets:
    radiology: raw/POC_test/radiology.csv

evaluation:
  eval_script: evaluation/english_medical/eval_english_medical_asr_jsonl.py
  language: ""
  output_dir: outputs/poc_sft3900_real_hotword_prompt_ft/eval
  batch_size: 2
  max_new_tokens: 512

runtime:
  launcher: python
  nproc_per_node: 1
  resume: false
  dry_run: false
